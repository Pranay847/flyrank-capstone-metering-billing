# One command: docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: billing        # local-only dev credentials, not a secret
      POSTGRES_PASSWORD: billing
      POSTGRES_DB: billing
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file:
      - path: .env          # Stripe keys live here (git-ignored); optional
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://billing:billing@db:5432/billing
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      # Placeholder so webhook verification is active out of the box (forged -> 400).
      # Your real whsec_ from `stripe listen` in .env takes precedence.
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_dev_local_only}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
